name: Package Madeira with VC++ runtime

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Official Madeira release tag to package (for example v0.1.3)"
        required: true
        default: "v0.1.3"
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    steps:
      - name: Download official Madeira IPA
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          curl -fL --retry 3 \
            "https://github.com/willfaust/Madeira/releases/download/${TAG}/Madeira-${TAG#v}.ipa" \
            -o "$RUNNER_TEMP/Madeira-original.ipa"

      - name: Download and extract Microsoft's x64 VC++ runtime
        shell: bash
        run: |
          set -euo pipefail
          brew install sevenzip
          curl -fL --retry 3 https://aka.ms/vs/17/release/vc_redist.x64.exe \
            -o "$RUNNER_TEMP/VC_redist.x64.exe"

          mkdir -p "$RUNNER_TEMP/vcredist" "$RUNNER_TEMP/vcrt-extracted"
          7zz x "$RUNNER_TEMP/VC_redist.x64.exe" "-o$RUNNER_TEMP/vcredist" -y >/dev/null

          # Extract every CAB shipped inside the Microsoft redistributable.
          while IFS= read -r -d '' cab; do
            7zz x "$cab" "-o$RUNNER_TEMP/vcrt-extracted" -y >/dev/null
          done < <(find "$RUNNER_TEMP/vcredist" -type f -iname '*.cab' -print0)

          mkdir -p "$RUNNER_TEMP/x86_64-vcruntime"
          files=(
            concrt140.dll
            msvcp140.dll
            msvcp140_1.dll
            msvcp140_2.dll
            msvcp140_atomic_wait.dll
            msvcp140_codecvt_ids.dll
            vcamp140.dll
            vccorlib140.dll
            vcomp140.dll
            vcruntime140.dll
            vcruntime140_1.dll
            vcruntime140_threads.dll
          )

          for file in "${files[@]}"; do
            source_file="$(find "$RUNNER_TEMP/vcrt-extracted" -type f -iname "$file" -print -quit)"
            if [[ -z "$source_file" ]]; then
              echo "::error::Missing expected Microsoft runtime file: $file"
              exit 1
            fi
            cp "$source_file" "$RUNNER_TEMP/x86_64-vcruntime/$file"
          done

          echo "Verified all ${#files[@]} required runtime DLLs."

      - name: Add runtime to IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa-work"
          cd "$RUNNER_TEMP/ipa-work"
          unzip -q "$RUNNER_TEMP/Madeira-original.ipa"

          APP_PATH="$(find Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "::error::No .app bundle found in the downloaded IPA."
            exit 1
          fi

          # Madeira looks for this folder at the root of its app bundle.
          mkdir -p "$APP_PATH/x86_64-vcruntime"
          cp "$RUNNER_TEMP/x86_64-vcruntime/"*.dll "$APP_PATH/x86_64-vcruntime/"

          count="$(find "$APP_PATH/x86_64-vcruntime" -maxdepth 1 -type f -name '*.dll' | wc -l | tr -d ' ')"
          if [[ "$count" != "12" ]]; then
            echo "::error::Expected 12 runtime DLLs in the app; found $count."
            exit 1
          fi

          OUTPUT="$GITHUB_WORKSPACE/Madeira-${{ inputs.release_tag }}-with-vcruntime.ipa"
          /usr/bin/zip -qry "$OUTPUT" Payload
          echo "Created $OUTPUT"
          echo "output_ipa=$OUTPUT" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-${{ inputs.release_tag }}-with-vcruntime
          path: ${{ env.output_ipa }}
          if-no-files-found: error
          retention-days: 7
