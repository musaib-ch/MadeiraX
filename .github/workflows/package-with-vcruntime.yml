name: Package Madeira with VC++ runtime

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Official Madeira release tag to package (for example v0.1.3)"
        required: true
        default: "v0.1.3"
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    steps:
      - name: Download official Madeira IPA
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          curl -fL --retry 3 \
            "https://github.com/willfaust/Madeira/releases/download/${TAG}/Madeira-${TAG#v}.ipa" \
            -o "$RUNNER_TEMP/Madeira-original.ipa"

      - name: Add runtime to IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa-work"
          cd "$RUNNER_TEMP/ipa-work"
          unzip -q "$RUNNER_TEMP/Madeira-original.ipa"

          APP_PATH="$(find Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "::error::No .app bundle found in the downloaded IPA."
            exit 1
          fi

          mkdir -p "$APP_PATH/x86_64-vcruntime"
          cat > "$APP_PATH/x86_64-vcruntime/README.txt" <<'EOF'
Add the genuine Microsoft x64 VC++ runtime DLL files to this folder.
Keep the original DLL files unchanged. This placeholder does not itself fix
missing-runtime errors until the required DLLs are added.
EOF
          echo "Created runtime folder at $APP_PATH/x86_64-vcruntime"

          OUTPUT="$GITHUB_WORKSPACE/Madeira-${{ inputs.release_tag }}-with-vcruntime.ipa"
          /usr/bin/zip -qry "$OUTPUT" Payload
          echo "Created $OUTPUT"
          echo "output_ipa=$OUTPUT" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-${{ inputs.release_tag }}-with-vcruntime
          path: ${{ env.output_ipa }}
          if-no-files-found: error
          retention-days: 7
